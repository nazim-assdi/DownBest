name: DownBest cross-platform builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: downbest-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installers
            path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-15
            artifact: macos-arm64
            path: src-tauri/target/release/bundle/dmg/*.dmg
          - os: macos-15-intel
            artifact: macos-x64
            path: src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            artifact: linux-packages
            path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - name: Prepare bundled media tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tools = "src-tauri/tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$tools/yt-dlp.exe"
          $ariaZip = "$env:RUNNER_TEMP/aria2.zip"
          Invoke-WebRequest "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" -OutFile $ariaZip
          Expand-Archive $ariaZip "$env:RUNNER_TEMP/aria2" -Force
          $ariaExe = Get-ChildItem "$env:RUNNER_TEMP/aria2" -Recurse -Filter aria2c.exe | Select-Object -First 1
          if (-not $ariaExe) { throw "aria2c.exe was not found in the upstream release." }
          Copy-Item $ariaExe.FullName "$tools/aria2c.exe"
          Get-ChildItem $ariaExe.DirectoryName -File | Where-Object { $_.Extension -eq ".dll" } | Copy-Item -Destination $tools
          $ffZip = "$env:RUNNER_TEMP/ffmpeg.zip"
          Invoke-WebRequest "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile $ffZip
          Expand-Archive $ffZip "$env:RUNNER_TEMP/ffmpeg" -Force
          $ffExe = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffExe) { throw "FFmpeg executable was not found in the LGPL build." }
          Get-ChildItem $ffExe.DirectoryName -File | Copy-Item -Destination $tools
          Get-ChildItem $tools -File | ForEach-Object { if ($_.Extension -eq ".exe") { Unblock-File $_ } }
      - name: Prepare bundled media tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tools="src-tauri/tools"
          mkdir -p "$tools/lib"
          curl -fsSL "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux" -o "$tools/yt-dlp"
          chmod +x "$tools/yt-dlp"
          sudo apt-get install -y aria2 patchelf
          cp "$(command -v aria2c)" "$tools/aria2c"
          ldd "$tools/aria2c" | tr ' ' '\n' | grep -E '/.*[.]so' | sort -u | while read -r dep; do
            base="$(basename "$dep")"
            case "$base" in libc.so*|libm.so*|libpthread.so*|librt.so*|libdl.so*|ld-linux*) continue ;; esac
            if [ -f "$dep" ]; then cp -L "$dep" "$tools/lib/$base"; fi
          done
          patchelf --set-rpath '$ORIGIN/lib' "$tools/aria2c"
          ff="$RUNNER_TEMP/ffmpeg-linux.tar.xz"
          curl -fsSL "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz" -o "$ff"
          mkdir -p "$RUNNER_TEMP/ffmpeg-linux"
          tar -xJf "$ff" -C "$RUNNER_TEMP/ffmpeg-linux"
          ffmpeg_bin="$(find "$RUNNER_TEMP/ffmpeg-linux" -type f -name ffmpeg | head -n 1)"
          ffprobe_bin="$(find "$RUNNER_TEMP/ffmpeg-linux" -type f -name ffprobe | head -n 1)"
          test -n "$ffmpeg_bin"
          cp "$ffmpeg_bin" "$tools/ffmpeg"
          if [ -n "$ffprobe_bin" ]; then cp "$ffprobe_bin" "$tools/ffprobe"; fi
          chmod +x "$tools/ffmpeg" "$tools/ffprobe" "$tools/aria2c"
      - name: Prepare bundled media tools (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          tools="$GITHUB_WORKSPACE/src-tauri/tools"
          mkdir -p "$tools/lib"
          curl -fsSL "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" -o "$tools/yt-dlp"
          chmod +x "$tools/yt-dlp"
          brew install nasm aria2 dylibbundler
          cp "$(brew --prefix aria2)/bin/aria2c" "$tools/aria2c"
          dylibbundler -b -x "$tools/aria2c" -d "$tools/lib" -p @executable_path/lib
          curl -fsSL "https://ffmpeg.org/releases/ffmpeg-9.1.tar.xz" -o "$RUNNER_TEMP/ffmpeg-9.1.tar.xz"
          tar -xf "$RUNNER_TEMP/ffmpeg-9.1.tar.xz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/ffmpeg-9.1"
          ./configure --prefix="$RUNNER_TEMP/ffmpeg-install" --disable-gpl --disable-nonfree --disable-autodetect --enable-static --disable-shared --disable-debug --disable-doc --enable-ffmpeg --enable-ffprobe --disable-ffplay
          make -j"$(sysctl -n hw.ncpu)"
          make install
          test -x "$RUNNER_TEMP/ffmpeg-install/bin/ffmpeg"
          test -x "$RUNNER_TEMP/ffmpeg-install/bin/ffprobe"
          cp "$RUNNER_TEMP/ffmpeg-install/bin/ffmpeg" "$tools/ffmpeg"
          cp "$RUNNER_TEMP/ffmpeg-install/bin/ffprobe" "$tools/ffprobe"
          chmod +x "$tools/aria2c" "$tools/ffmpeg" "$tools/ffprobe"
      - name: Verify bundled tools
        shell: bash
        run: |
          find src-tauri/tools -maxdepth 2 -type f -print
          test -f src-tauri/tools/yt-dlp -o -f src-tauri/tools/yt-dlp.exe
          test -f src-tauri/tools/aria2c -o -f src-tauri/tools/aria2c.exe
          test -f src-tauri/tools/ffmpeg -o -f src-tauri/tools/ffmpeg.exe
      - name: Install frontend dependencies
        run: npm install
      - name: Generate app icons
        run: npm run tauri icon app-icon.svg
      - name: Build desktop app
        run: npm run tauri build
      - name: Run Rust unit tests
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        run: npm install
      - name: Initialize Android project
        run: |
          npm run tauri android init
          python - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("src-tauri/gen/android/app/build.gradle.kts")
          content = gradle.read_text()
          content, changed = re.subn(r"(?m)^(\s*compileSdk\s*=\s*)\d+", r"\g<1>36", content, count=1)
          if not changed:
              raise SystemExit("Could not locate compileSdk in generated Android app/build.gradle.kts")
          content = re.sub(r"(?m)^(\s*targetSdk\s*=\s*)\d+", r"\g<1>36", content, count=1)
          gradle.write_text(content)
          print("Android compileSdk/targetSdk API 36; ABI filters: arm64-v8a, x86_64")
          PY
      - name: Generate app icons
        run: npm run tauri icon app-icon.svg
      - name: Build APKs
        run: npm run tauri android build -- --apk --split-per-abi
      - name: Sign and validate Android APKs
        shell: bash
        env:
          DOWNBEST_ANDROID_KEYSTORE_BASE64: ${{ secrets.DOWNBEST_ANDROID_KEYSTORE_BASE64 }}
          DOWNBEST_ANDROID_STORE_PASSWORD: ${{ secrets.DOWNBEST_ANDROID_STORE_PASSWORD }}
          DOWNBEST_ANDROID_KEY_ALIAS: ${{ secrets.DOWNBEST_ANDROID_KEY_ALIAS }}
          DOWNBEST_ANDROID_KEY_PASSWORD: ${{ secrets.DOWNBEST_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk_dir="src-tauri/gen/android/app/build/outputs/apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          keystore="$RUNNER_TEMP/downbest-signing.keystore"

          # The embedded yt-dlp runtime is distributed for 64-bit Android only.
          # Tauri may still emit 32-bit split APKs; do not sign or publish them.
          find "$apk_dir" -type f -name '*-unsigned.apk' \
            \( -path '*/arm/*' -o -path '*/x86/*' \) -delete
          mapfile -t unsigned_apks < <(find "$apk_dir" -type f -name '*-unsigned.apk' -print | sort)
          if [ "${#unsigned_apks[@]}" -eq 0 ]; then
            echo "No unsigned APKs were produced." >&2
            exit 1
          fi

          if [[ -n "${DOWNBEST_ANDROID_KEYSTORE_BASE64:-}" || -n "${DOWNBEST_ANDROID_STORE_PASSWORD:-}" || -n "${DOWNBEST_ANDROID_KEY_ALIAS:-}" || -n "${DOWNBEST_ANDROID_KEY_PASSWORD:-}" ]]; then
            if [[ -z "${DOWNBEST_ANDROID_KEYSTORE_BASE64:-}" || -z "${DOWNBEST_ANDROID_STORE_PASSWORD:-}" || -z "${DOWNBEST_ANDROID_KEY_ALIAS:-}" || -z "${DOWNBEST_ANDROID_KEY_PASSWORD:-}" ]]; then
              echo "All four DOWNBEST_ANDROID_* signing secrets must be configured together." >&2
              exit 1
            fi
            printf '%s' "$DOWNBEST_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            store_password="$DOWNBEST_ANDROID_STORE_PASSWORD"
            key_alias="$DOWNBEST_ANDROID_KEY_ALIAS"
            key_password="$DOWNBEST_ANDROID_KEY_PASSWORD"
            echo "Using the configured persistent Android signing key."
          else
            store_password="android"
            key_alias="androiddebugkey"
            key_password="android"
            keytool -genkeypair -v \
              -keystore "$keystore" \
              -storepass "$store_password" \
              -alias "$key_alias" \
              -keypass "$key_password" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=DownBest CI Debug,O=DownBest,C=BD"
            echo "::warning::No persistent Android signing key is configured. This APK is signed for sideload testing; a new CI signing key is generated for each run, so uninstall this build before installing a later CI build. Configure the four DOWNBEST_ANDROID_* repository secrets for stable app updates."
          fi
          chmod 600 "$keystore"
          export DOWNBEST_APK_STORE_PASSWORD="$store_password"
          export DOWNBEST_APK_KEY_PASSWORD="$key_password"

          for unsigned_apk in "${unsigned_apks[@]}"; do
            signed_apk="${unsigned_apk%-unsigned.apk}.apk"
            aligned_apk="$RUNNER_TEMP/$(basename "${unsigned_apk%-unsigned.apk}").aligned.apk"

            "$build_tools/zipalign" -f -P 16 4 "$unsigned_apk" "$aligned_apk"
            "$build_tools/apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$key_alias" \
              --ks-pass env:DOWNBEST_APK_STORE_PASSWORD \
              --key-pass env:DOWNBEST_APK_KEY_PASSWORD \
              --out "$signed_apk" "$aligned_apk"

            "$build_tools/apksigner" verify --verbose --print-certs "$signed_apk"
            "$build_tools/zipalign" -c -P 16 4 "$signed_apk"
            unzip -t "$signed_apk" >/dev/null

            package_line="$("$build_tools/aapt" dump badging "$signed_apk" | sed -n '1p')"
            if [[ "$package_line" != package:* ]]; then
              echo "APK manifest/package metadata is missing: $signed_apk" >&2
              exit 1
            fi

            abi_dir="${unsigned_apk#"$apk_dir"/}"
            abi_dir="${abi_dir%%/*}"
            case "$abi_dir" in
              arm64) native_abi="arm64-v8a" ;;
              x86_64) native_abi="x86_64" ;;
              *) echo "Unexpected APK ABI folder: $abi_dir" >&2; exit 1 ;;
            esac
            unzip -Z1 "$signed_apk" | grep -qx "lib/$native_abi/libdownbest_lib.so" || {
              echo "Expected $native_abi native library is missing from $signed_apk" >&2
              exit 1
            }

            echo "Validated signed APK: $signed_apk ($native_abi)"
            echo "$package_line"
            rm -f "$unsigned_apk" "$aligned_apk"
          done

          if find "$apk_dir" -type f -name '*-unsigned.apk' | grep -q .; then
            echo "Unsigned APKs must not be uploaded." >&2
            exit 1
          fi
      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  ios-rust-check:
    name: iOS Rust compile check (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Install frontend dependencies
        run: npm install
      - name: Prepare Tauri frontend assets
        run: |
          npm run build
          npm run tauri icon app-icon.svg
      - name: Link Tauri iOS API for swift-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --manifest-path src-tauri/Cargo.toml
          tauri_ios_api="$(find "$HOME/.cargo/registry/src" -type d -path '*/tauri-*/mobile/ios-api' -print | sort | tail -n 1)"
          if [[ -z "$tauri_ios_api" ]]; then
            echo "Could not locate the Tauri iOS Swift API package in the Cargo registry." >&2
            exit 1
          fi
          dependency_path="$GITHUB_WORKSPACE/../../crates/tauri/mobile/ios-api"
          mkdir -p "$(dirname "$dependency_path")"
          ln -sfn "$tauri_ios_api" "$dependency_path"
          echo "Linked swift-rs Tauri API package to $tauri_ios_api"
      - name: Compile unsigned iOS device and simulator targets
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --lib
          SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)" cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios-sim --lib

  ios:
    name: iOS IPA (requires Apple signing setup)
    if: ${{ vars.ENABLE_SIGNED_IOS_BUILD == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Install frontend dependencies
        run: npm install
      - name: Initialize iOS project
        run: npm run tauri ios init
      - name: Generate app icons
        run: npm run tauri icon app-icon.svg
      - name: Build iOS IPA
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: npm run tauri ios build -- --export-method app-store-connect
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: warn
          retention-days: 14
